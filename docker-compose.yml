version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: telebot_postgres
    environment:
      POSTGRES_USER: telebot
      POSTGRES_PASSWORD: telebot_secret
      POSTGRES_DB: telebot_db
    ports:
      - "5432:5432"
    volumes:
      - telebot_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telebot -d telebot_db"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  telebot_pg_data:
