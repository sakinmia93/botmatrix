# Fallback if you prefer Nixpacks instead of Dockerfile
# Railway: Settings → Build → set builder to Nixpacks, or remove railway.toml dockerfile

[phases.setup]
nixPkgs = ["nodejs_22", "python312", "python312Packages.pip", "gcc", "openssl"]

[phases.install]
cmds = [
  "npm ci",
  "python3 -m pip install --user -r backend/requirements.txt"
]

[phases.build]
cmds = [
  "npx vite build",
  "npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --outfile=dist/server.cjs"
]

[start]
cmd = "NODE_ENV=production node dist/server.cjs"

[variables]
NODE_ENV = "production"
API_PORT = "5001"
